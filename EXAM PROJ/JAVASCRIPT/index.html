<!DOCTYPE html>
<!-- Records - Grant James D. Bue - 25-0873-849 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Record System - Grant James D. Bue - 25-0873-849</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 32px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: fadeInDown 0.8s ease;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
        }

        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .form-section h2 {
            margin-bottom: 20px;
            color: #667eea;
            font-size: 24px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .search-bar {
            margin-bottom: 20px;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input.error {
            border-color: #f44336;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 35px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .btn-add {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-clear {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-render {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-export {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
        }

        .table-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            overflow-x: auto;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .table-header h2 {
            color: #667eea;
            font-size: 24px;
        }

        .record-count {
            background: #667eea;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
        }

        table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }

        table tbody tr {
            transition: all 0.3s ease;
        }

        table tbody tr:hover {
            background: linear-gradient(90deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            transform: scale(1.01);
        }

        .delete-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 8px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }

        .grade-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 12px;
        }

        .grade-excellent {
            background: #4caf50;
            color: white;
        }

        .grade-good {
            background: #2196F3;
            color: white;
        }

        .grade-average {
            background: #ff9800;
            color: white;
        }

        .grade-poor {
            background: #f44336;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            h1 {
                font-size: 24px;
            }
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            z-index: 1000;
            animation: slideIn 0.5s ease;
            max-width: 400px;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast.success {
            border-left: 5px solid #4caf50;
        }

        .toast.error {
            border-left: 5px solid #f44336;
        }

        .toast-close {
            position: absolute;
            top: 10px;
            right: 15px;
            cursor: pointer;
            font-size: 20px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 Student Record System - Grant James D. Bue - 25-0873-849</h1>
        
        <!-- Statistics Dashboard -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalStudents">0</div>
                <div class="stat-label">Total Students</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="avgGrade">0</div>
                <div class="stat-label">Average Grade</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="topStudent">-</div>
                <div class="stat-label">Top Student</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="passRate">0%</div>
                <div class="stat-label">Pass Rate</div>
            </div>
        </div>

        <!-- Input Form -->
        <div class="form-section">
            <h2>➕ Add New Student Record</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="studentId">Student ID:</label>
                    <input type="text" id="studentId" placeholder="e.g., 25-0873-849">
                </div>
                <div class="form-group">
                    <label for="firstName">First Name:</label>
                    <input type="text" id="firstName" placeholder="e.g., Grant">
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name:</label>
                    <input type="text" id="lastName" placeholder="e.g., Bue">
                </div>
                <div class="form-group">
                    <label for="labWork1">Lab Work 1 (0-100):</label>
                    <input type="number" id="labWork1" min="0" max="100" placeholder="0-100">
                </div>
                <div class="form-group">
                    <label for="labWork2">Lab Work 2 (0-100):</label>
                    <input type="number" id="labWork2" min="0" max="100" placeholder="0-100">
                </div>
                <div class="form-group">
                    <label for="labWork3">Lab Work 3 (0-100):</label>
                    <input type="number" id="labWork3" min="0" max="100" placeholder="0-100">
                </div>
                <div class="form-group">
                    <label for="prelimExam">Prelim Exam (0-100):</label>
                    <input type="number" id="prelimExam" min="0" max="100" placeholder="0-100">
                </div>
                <div class="form-group">
                    <label for="attendance">Attendance Grade (0-100):</label>
                    <input type="number" id="attendance" min="0" max="100" placeholder="0-100">
                </div>
            </div>
            
            <div class="button-group">
                <button class="btn-add" onclick="create()">✓ Add Record</button>
                <button class="btn-clear" onclick="clearFields()">✗ Clear Fields</button>
                <button class="btn-render" onclick="render()">↻ Refresh Table</button>
                <button class="btn-export" onclick="exportToCSV()">⬇ Export CSV</button>
            </div>
        </div>

        <!-- Records Table -->
        <div class="table-section">
            <div class="table-header">
                <h2>📋 Student Records</h2>
                <div class="record-count" id="recordCount">0 Records</div>
            </div>
            
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="🔍 Search by name or student ID..." onkeyup="searchRecords()">
            </div>

            <table id="studentTable">
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Lab 1</th>
                        <th>Lab 2</th>
                        <th>Lab 3</th>
                        <th>Prelim</th>
                        <th>Attendance</th>
                        <th>Average</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Records - Grant James D. Bue - 25-0873-849

        // Hardcoded CSV content
        const csvData = `Student ID,First Name,Last Name,Lab Work 1,Lab Work 2,Lab Work 3,Prelim Exam,Attendance Grade
073900438,Osbourne,Wakenshaw,69,5,52,12,78
114924014,Albie,Gierardi,58,92,16,57,97
111901632,Eleen,Pentony,43,81,34,36,16
084000084,Arie,Okenden,31,5,14,39,99
272471551,Alica,Muckley,49,66,97,3,95
104900721,Jo,Burleton,98,94,33,13,29
111924392,Cam,Akram,44,84,17,16,24
292970744,Celine,Brosoli,3,15,71,83,45
107004352,Alan,Belfit,31,51,36,70,48
071108313,Jeanette,Gilvear,4,78,15,69,69
042204932,Ethelin,MacCathay,48,36,23,1,11
111914218,Kakalina,Finnick,69,5,65,10,8
074906059,Mayer,Lorenzetti,36,30,100,41,92
091000080,Selia,Rosenstengel,15,42,85,68,28
055002480,Dalia,Tadd,84,86,13,91,22
063101111,Darryl,Doogood,36,3,78,13,100
071908827,Brier,Wace,69,92,23,75,40
322285668,Bucky,Udall,97,63,19,46,28
103006406,Haslett,Beaford,41,32,85,60,61
104913048,Shelley,Spring,84,73,63,59,3`;

        let studentsArray = [];
        let filteredArray = [];

        // Parse CSV
        function parseCSV(csvString) {
            const lines = csvString.trim().split('\n');
            const headers = lines[0].split(',');
            const data = [];

            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',');
                const obj = {};
                
                for (let j = 0; j < headers.length; j++) {
                    obj[headers[j].trim()] = values[j].trim();
                }
                
                data.push(obj);
            }

            return data;
        }

        // Calculate average grade
        function calculateAverage(student) {
            const grades = [
                parseFloat(student['Lab Work 1']) || 0,
                parseFloat(student['Lab Work 2']) || 0,
                parseFloat(student['Lab Work 3']) || 0,
                parseFloat(student['Prelim Exam']) || 0,
                parseFloat(student['Attendance Grade']) || 0
            ];
            const sum = grades.reduce((a, b) => a + b, 0);
            return (sum / grades.length).toFixed(2);
        }

        // Get grade badge HTML
        function getGradeBadge(avg) {
            if (avg >= 90) return `<span class="grade-badge grade-excellent">${avg}</span>`;
            if (avg >= 75) return `<span class="grade-badge grade-good">${avg}</span>`;
            if (avg >= 60) return `<span class="grade-badge grade-average">${avg}</span>`;
            return `<span class="grade-badge grade-poor">${avg}</span>`;
        }

        // Update statistics
        function updateStatistics() {
            const total = studentsArray.length;
            document.getElementById('totalStudents').textContent = total;
            document.getElementById('recordCount').textContent = `${total} Records`;

            if (total === 0) {
                document.getElementById('avgGrade').textContent = '0';
                document.getElementById('topStudent').textContent = '-';
                document.getElementById('passRate').textContent = '0%';
                return;
            }

            // Calculate average grade
            let totalAvg = 0;
            let passCount = 0;
            let topAvg = 0;
            let topName = '';

            studentsArray.forEach(student => {
                const avg = parseFloat(calculateAverage(student));
                totalAvg += avg;
                if (avg >= 75) passCount++;
                if (avg > topAvg) {
                    topAvg = avg;
                    topName = student['First Name'];
                }
            });

            document.getElementById('avgGrade').textContent = (totalAvg / total).toFixed(1);
            document.getElementById('topStudent').textContent = topName;
            document.getElementById('passRate').textContent = `${((passCount / total) * 100).toFixed(0)}%`;
        }

        // Show toast notification
        function showToast(message, type = 'success') {
            const existingToast = document.querySelector('.toast');
            if (existingToast) existingToast.remove();

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span class="toast-close" onclick="this.parentElement.remove()">×</span>
                <strong>${type === 'success' ? '✓' : '✗'}</strong> ${message}
            `;
            document.body.appendChild(toast);

            setTimeout(() => toast.remove(), 3000);
        }

        // Render table
        function render() {
            const tableBody = document.getElementById('tableBody');
            const dataToRender = filteredArray.length > 0 ? filteredArray : studentsArray;

            if (dataToRender.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="10" class="empty-state">
                            <div>📭</div>
                            <h3>No records found</h3>
                            <p>Add a student record to get started</p>
                        </td>
                    </tr>
                `;
                updateStatistics();
                return;
            }

            tableBody.innerHTML = '';

            dataToRender.forEach((student, index) => {
                const avg = calculateAverage(student);
                const row = `
                    <tr>
                        <td><strong>${student['Student ID']}</strong></td>
                        <td>${student['First Name']}</td>
                        <td>${student['Last Name']}</td>
                        <td>${student['Lab Work 1']}</td>
                        <td>${student['Lab Work 2']}</td>
                        <td>${student['Lab Work 3']}</td>
                        <td>${student['Prelim Exam']}</td>
                        <td>${student['Attendance Grade']}</td>
                        <td>${getGradeBadge(avg)}</td>
                        <td><button class="delete-btn" onclick="deleteRecord(${index})">Delete</button></td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });

            updateStatistics();
        }

        // Search records
        function searchRecords() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            if (searchTerm === '') {
                filteredArray = [];
                render();
                return;
            }

            filteredArray = studentsArray.filter(student => {
                return student['Student ID'].toLowerCase().includes(searchTerm) ||
                       student['First Name'].toLowerCase().includes(searchTerm) ||
                       student['Last Name'].toLowerCase().includes(searchTerm);
            });

            render();
        }

        // Validate input
        function validateInput() {
            const fields = ['studentId', 'firstName', 'lastName', 'labWork1', 'labWork2', 'labWork3', 'prelimExam', 'attendance'];
            let isValid = true;

            fields.forEach(fieldId => {
                const field = document.getElementById(fieldId);
                const value = field.value.trim();

                if (!value) {
                    field.classList.add('error');
                    isValid = false;
                } else {
                    field.classList.remove('error');
                }

                // Validate grade ranges
                if (fieldId !== 'studentId' && fieldId !== 'firstName' && fieldId !== 'lastName') {
                    const numValue = parseFloat(value);
                    if (numValue < 0 || numValue > 100) {
                        field.classList.add('error');
                        isValid = false;
                    }
                }
            });

            return isValid;
        }

        // Create new record
        function create() {
            if (!validateInput()) {
                showToast('Please fill in all fields correctly (grades must be 0-100)', 'error');
                return;
            }

            const newStudent = {
                'Student ID': document.getElementById('studentId').value.trim(),
                'First Name': document.getElementById('firstName').value.trim(),
                'Last Name': document.getElementById('lastName').value.trim(),
                'Lab Work 1': document.getElementById('labWork1').value.trim(),
                'Lab Work 2': document.getElementById('labWork2').value.trim(),
                'Lab Work 3': document.getElementById('labWork3').value.trim(),
                'Prelim Exam': document.getElementById('prelimExam').value.trim(),
                'Attendance Grade': document.getElementById('attendance').value.trim()
            };

            studentsArray.push(newStudent);
            clearFields();
            render();
            showToast('Record added successfully!', 'success');
        }

        // Delete record
        function deleteRecord(index) {
            if (confirm('Are you sure you want to delete this record?')) {
                studentsArray.splice(index, 1);
                render();
                showToast('Record deleted successfully!', 'success');
            }
        }

        // Clear input fields
        function clearFields() {
            const fields = ['studentId', 'firstName', 'lastName', 'labWork1', 'labWork2', 'labWork3', 'prelimExam', 'attendance'];
            fields.forEach(fieldId => {
                const field = document.getElementById(fieldId);
                field.value = '';
                field.classList.remove('error');
            });
        }

        // Export to CSV
        function exportToCSV() {
            if (studentsArray.length === 0) {
                showToast('No records to export', 'error');
                return;
            }

            let csv = 'Student ID,First Name,Last Name,Lab Work 1,Lab Work 2,Lab Work 3,Prelim Exam,Attendance Grade,Average\n';
            
            studentsArray.forEach(student => {
                const avg = calculateAverage(student);
                csv += `${student['Student ID']},${student['First Name']},${student['Last Name']},`;
                csv += `${student['Lab Work 1']},${student['Lab Work 2']},${student['Lab Work 3']},`;
                csv += `${student['Prelim Exam']},${student['Attendance Grade']},${avg}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'student_records_grant_bue.csv';
            a.click();
            window.URL.revokeObjectURL(url);
            
            showToast('Records exported successfully!', 'success');
        }

        // Initialize
        window.onload = function() {
            studentsArray = parseCSV(csvData);
            render();
        };
    </script>
</body>
</html>
